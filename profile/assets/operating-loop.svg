<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" role="img" aria-labelledby="t d">
<title id="t">How INTFRAME ships: an agent-driven loop that verifies where a domain is served, keeps the previous build, and rolls itself back</title>
<desc id="d">An instruction arrives in chat. Agent sessions work in parallel on the build host, which runs internal systems only. Before shipping, a gate measures which host actually serves the domain, because building the wrong one changes nothing. The previous build is kept before the new one is made. A health daemon checks every 15 seconds and restores the previous build if a site does not come up, then reports back in the same chat.</desc>
<style>
  .box  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1 }
  .soft { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1 }
  .key  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1 }
  .warn { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1 }
  .h { fill: #1f2328; font: 600 13px ui-sans-serif,-apple-system,"Segoe UI",sans-serif }
  .l { fill: #656d76; font: 11.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif }
  .m { fill: #656d76; font: 10.5px ui-monospace,SFMono-Regular,Menlo,monospace }
  .ln   { stroke: #8c959f; stroke-width: 1.3; fill: none }
  .back { stroke: #bf8700; stroke-width: 1.3; fill: none }
  @media (prefers-color-scheme: dark) {
    .box  { fill: #0d1117; stroke: #30363d }
    .soft { fill: #161b22; stroke: #30363d }
    .key  { fill: #0c1d2e; stroke: #1f6feb }
    .warn { fill: #272115; stroke: #9e6a03 }
    .h { fill: #e6edf3 }
    .l, .m { fill: #8b949e }
    .ln { stroke: #6e7681 }
    .back { stroke: #d29922 }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8c959f"/></marker>
  <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#bf8700"/></marker>
</defs>

<rect x="300" y="30" width="260" height="48" rx="6" class="box"/>
<text x="430" y="52" class="h" text-anchor="middle">An instruction, in chat</text>
<text x="430" y="69" class="l" text-anchor="middle">plain language, no ticket</text>

<path d="M430 78 V 106" class="ln" marker-end="url(#a)"/>

<rect x="300" y="106" width="260" height="62" rx="6" class="soft"/>
<text x="430" y="129" class="h" text-anchor="middle">Agent sessions</text>
<text x="430" y="147" class="l" text-anchor="middle">several in parallel, each with its own</text>
<text x="430" y="162" class="l" text-anchor="middle">working tree and account</text>

<path d="M430 168 V 196" class="ln" marker-end="url(#a)"/>

<rect x="300" y="196" width="260" height="62" rx="6" class="soft"/>
<text x="430" y="219" class="h" text-anchor="middle">Build host</text>
<text x="430" y="237" class="l" text-anchor="middle">source, builds, internal systems.</text>
<text x="430" y="252" class="l" text-anchor="middle">No customer traffic reaches it</text>

<path d="M430 258 V 286" class="ln" marker-end="url(#a)"/>

<rect x="300" y="286" width="260" height="78" rx="6" class="key"/>
<text x="430" y="309" class="h" text-anchor="middle">Where does this actually serve?</text>
<text x="430" y="328" class="l" text-anchor="middle">measured per domain before shipping,</text>
<text x="430" y="343" class="l" text-anchor="middle">from the response headers themselves</text>
<text x="430" y="358" class="m" text-anchor="middle">the wrong host ships nothing</text>

<path d="M430 364 V 396" class="ln" marker-end="url(#a)"/>
<text x="442" y="385" class="l">keep the previous build first</text>

<rect x="300" y="396" width="260" height="62" rx="6" class="soft"/>
<text x="430" y="419" class="h" text-anchor="middle">Edge host</text>
<text x="430" y="437" class="l" text-anchor="middle">the only thing customers touch.</text>
<text x="430" y="452" class="l" text-anchor="middle">Sites, in three time zones</text>

<path d="M430 458 V 488" class="ln" marker-end="url(#a)"/>

<rect x="300" y="488" width="260" height="66" rx="6" class="warn"/>
<text x="430" y="511" class="h" text-anchor="middle">Health daemon</text>
<text x="430" y="529" class="l" text-anchor="middle">every 15 seconds, every live domain</text>
<text x="430" y="545" class="l" text-anchor="middle">no human waits to find out</text>

<path d="M560 521 H 664 V 427 H 566" class="back" marker-end="url(#w)"/>
<text x="676" y="452" class="l">did not come up:</text>
<text x="676" y="468" class="l">restore the</text>
<text x="676" y="484" class="l">previous build</text>

<path d="M300 521 H 196 V 54 H 294" class="ln" marker-end="url(#a)"/>
<text x="182" y="266" class="l" text-anchor="end">what shipped,</text>
<text x="182" y="282" class="l" text-anchor="end">what broke,</text>
<text x="182" y="298" class="l" text-anchor="end">what rolled back,</text>
<text x="182" y="314" class="l" text-anchor="end">in the same chat</text>
</svg>
